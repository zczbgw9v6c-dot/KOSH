<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Porto Pizza K · Compose ta pizza</title>
<meta name="theme-color" content="#191c36">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:#11132a;color:#f5f1ea;font-family:Rubik,system-ui,sans-serif}
  main{max-width:440px;margin:0 auto;padding:16px 16px 40px}
  .brand{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 12px}
  .brand b{font-weight:700;letter-spacing:.14em;font-size:13px;color:#4cc26e}
  .brand span{font-size:12px;color:rgba(236,232,255,.55)}
  .cart{margin-top:16px;padding:14px 16px;border-radius:22px;background:#1b1e3b;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .cart h4{margin:0 0 8px;font-size:13px;font-weight:600;color:rgba(236,232,255,.62)}
  .cart ul{list-style:none;margin:0;padding:0}
  .cart li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07);font-size:14px}
  .cart li small{display:block;color:rgba(236,232,255,.55);font-size:12px;margin-top:2px}
  .cart li b{font-variant-numeric:tabular-nums}
  .cart .empty{font-size:13px;color:rgba(236,232,255,.45)}
</style>
</head>
<body>
<main>
  <div class="brand"><b>PORTO PIZZA K</b><span>33 Rua Nicolau Marques Guedes</span></div>
  <div id="simulateur"></div>
  <section class="cart" aria-live="polite"><h4>Ta commande (démo)</h4><ul id="lignes"></ul><p class="empty" id="vide">Aucune pizza pour l’instant.</p></section>
</main>
<script src="simulateur.js"></script>
<script>
  // Démo : chaque pizza sortie du four arrive dans cette liste. Dans Kosh, onAdd ajoutera la ligne au panier.
  const fmt = n => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(n);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sim = PortoPizzaSimulator.mount(document.getElementById('simulateur'), {
    onAdd(line) {
      document.getElementById('vide').hidden = true;
      const li = document.createElement('li');
      li.innerHTML = `<span>${esc(line.name)}<small>${line.options.map(esc).join(' · ')}</small></span><b>${fmt(line.price)}</b>`;
      document.getElementById('lignes').appendChild(li);
    },
  });
</script>
</body>
</html>
