let kHelpAnchor = null, kHelpPinned = false, kHelpTip = null;

function kCloseHelp() {

  kHelpTip.style.top = Math.max(12, below + h <= window.innerHeight - 12 ? below : r.top - h - 8) + 'px';
}

    button.textContent = 'i'; button.dataset.help = text;

    target.dataset.helpTitle = title;

    const title = card.querySelector('span')?.textContent.trim();
    add(card, title, kHelpTexts[title]);

  root.querySelectorAll('.box h3, .box summary').forEach(heading => {
    const title = heading.textContent.trim();
    const text = kHelpTexts[title] || (title.startsWith('#') ?
      'Détail de cette commande : produits, paiement, préparation et livraison. Chaque action validée est enregistrée ; le client voit les changements utiles au suivi.' :
      heading.querySelector('.pill') && typeof PK !== 'undefined' && PK.tab === 'couriers' ?
      'Affectez les restaurants et fixez la capacité et le transport de ce livreur, puis enregistrez. Sa disponibilité se règle depuis son espace.' : null);

document.addEventListener('pointerover', e => {

document.addEventListener('pointerout', e => {

document.addEventListener('focusin', e => { if (e.target.matches('.kosh-info')) kShowHelp(e.target); });
document.addEventListener('focusout', e => { if (e.target === kHelpAnchor) kCloseHelp(); });
document.addEventListener('click', e => {

A.order=function(){
  if(db)return originalPlaceOrder();
  if(!lines().length)return;
  if(shabbat().closed)return say('closedShab',true);
  if(mdoc(S.cartR).closed)return say('closedR',true);
  if(!(S.f.name||'').trim()||!(S.f.tel||'').trim()||(S.f.mode==='deliv'&&!(S.f.addr||'').trim()))return say('need',true);
  S.tab='payment';
};
function publicPayment(){
  const rows=lines();if(!rows.length)return vCart(shabbat());
  const sub=subtotal(),fee=feeOf(S.f.mode),promo=promoOf(S.cartR),discount=promo?Math.round(sub*promo.pct)/100:0;
  return `<button class="btn sm ghost" data-a="tab" data-v="cart">‹ ${t('cart')}</button>${kTitle('VOTRE COMMANDE','Récapitulatif et paiement')}<div class="box"><h3>${esc(merch(S.cartR).name)}</h3>${rows.map(row=>`<div class="tot"><span>${row.q} × ${esc(row.n)}${lo(row)}</span><b>${eur(row.p*row.q)}</b></div>`).join('')}<div class="tot"><span>${t('sub')}</span><b>${eur(sub)}</b></div>${discount?`<div class="tot"><span>${t('disc')}</span><b>−${eur(discount)}</b></div>`:''}${fee?`<div class="tot"><span>${t('fee')}</span><b>${eur(fee)}</b></div>`:''}<div class="tot big"><span>${t('total')}</span><b>${eur(sub-discount+fee)}</b></div><p>${esc(S.f.name)} · ${esc(S.f.tel)}<br>${t(S.f.mode)}${S.f.mode==='deliv'?' · '+esc(S.f.addr):''}</p><div class="info" role="status"><b>L’envoi des commandes n’est pas encore connecté.</b><p>Votre panier n’a pas été envoyé au restaurant. Aucun paiement n’a été effectué. Le paiement Revolut sera proposé après l’enregistrement de la commande auprès du restaurant.</p></div><button class="btn gold" disabled>Paiement indisponible pour le moment</button></div>`;
}

<script>
/* ---------- Agenda : une semaine par page, glisser ou flèches ---------- */
(function(){
const WT={fr:["Semaine du","au","Cette semaine"],en:["Week of","to","This week"],he:["שבוע","עד","השבוע"],pt:["Semana de","a","Esta semana"]};
const wt=k=>(WT[S.lang]||WT.fr)[k];
if(!store.events||typeof store.events!=="object")store.events={};
if(!Object.values(store.events).some(e=>e&&/backgammon/i.test(e.title||"")))store.events["pk-backgammon"]={title:"Porto Backgammon Society",time:"14:00",place:"O'Kaffé",dow:3,img:"bg"};
const MAXW=4;
function weekStart(w){const n=new Date();return -n.getDay()+7*w}
vAgenda=function(){const w=Math.max(0,Math.min(MAXW-1,S.wk||0));S.wk=w;const n=new Date(),dd=k=>new Date(n.getFullYear(),n.getMonth(),n.getDate()+k),ws=weekStart(w);
if(S.day==null||S.day<ws||S.day>ws+6)S.day=w===0?0:ws;
const a=dd(ws),b=dd(ws+6),f=d=>d.toLocaleDateString(loc(),{day:"numeric",month:"short"});
let h=`<div><h2 class="agh">AGENDA</h2><p class="mute">${t("agSub")}</p></div>
<div class="wkh"><button class="arr" data-a="wkgo" data-v="-1" aria-label="-" ${w?"":"disabled"}>‹</button><b>${w?`${wt(0)} ${f(a)} ${wt(1)} ${f(b)}`:wt(2)}</b><button class="arr" data-a="wkgo" data-v="1" aria-label="+" ${w<MAXW-1?"":"disabled"}>›</button></div>
<div class="wkg wkslide" style="--wkdir:${(S.wkdir||1)*24}px">${[0,1,2,3,4,5,6].map(i=>{const k=ws+i,d=dd(k),ev=dayRows(k).rows.some(r=>!r.calc);return `<button class="wkd ${k<0?"past":""} ${k===0?"today":""} ${ev?"ev":""}" data-a="day" data-v="${k}" aria-pressed="${k===S.day}"><span>${esc(d.toLocaleDateString(loc(),{weekday:"short"}))}</span><b>${d.getDate()}</b><i></i></button>`}).join("")}</div>
<div class="wkdots">${[...Array(MAXW).keys()].map(i=>`<i class="${i===w?"on":""}"></i>`).join("")}</div>`;
h+=dayRows(S.day).rows.map(r=>{const im=r.calc?(r.title==t("minha")?"minha":"arvit"):EVI.includes(r.img)?r.img:"";
return `<div class="evc" ${im?`style="background-image:url(img/ev-${im}.jpg)"`:""}><div class="evt"><time>${r.time}</time><i></i><b>${esc(r.title)}</b>${r.place?`<span>${esc(r.place)}</span>`:""}</div></div>`}).join("");
return h+`<p class="mute">${t("indic")}</p><p class="mute k-calj">${esc((typeof PK!=="undefined"&&PK.data&&PK.data.calj&&PK.data.calj.label)||"Horaires CalJ : source non configurée")}</p>`};
A.day=function(v){S.day=+v||0};
A.wkgo=function(v){const nw=Math.max(0,Math.min(MAXW-1,(S.wk||0)+(+v)));if(nw===(S.wk||0))return false;S.wkdir=+v>0?1:-1;S.wk=nw;S.day=nw===0?0:weekStart(nw)};
let sx=null,sy=0;
document.addEventListener("touchstart",e=>{const g=e.target.closest&&e.target.closest(".wkg");sx=g?e.touches[0].clientX:null;sy=g?e.touches[0].clientY:0},{passive:true});
document.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)<45||Math.abs(dy)>Math.abs(dx))return;let v=dx<0?1:-1;if(document.documentElement.dir==="rtl")v=-v;if(A.wkgo(String(v))!==false){render()}},{passive:true});
})();

/* ---------- Épicerie : rayons ---------- */
(function(){
const GL={promo:["🏷️",{fr:"Promos",en:"Deals",he:"מבצעים",pt:"Promoções"}],drinks:["🍷",{fr:"Boissons & alcools",en:"Drinks & alcohol",he:"משקאות ואלכוהול",pt:"Bebidas e álcool"}],meat:["🥩",{fr:"Boucherie",en:"Butcher",he:"קצבייה",pt:"Talho"}],cheese:["🧀",{fr:"Fromages & frais",en:"Cheese & dairy",he:"גבינות וחלבי",pt:"Queijos e frescos"}],shabbat:["🕯️",{fr:"Chabbat & maison",en:"Shabbat & home",he:"שבת ובית",pt:"Shabat e casa"}],sweet:["🍬",{fr:"Sucré & petit-déj",en:"Sweets & breakfast",he:"מתוקים וארוחת בוקר",pt:"Doces e pequeno-almoço"}],salty:["🥨",{fr:"Salé & apéro",en:"Savoury & snacks",he:"מלוחים ונשנושים",pt:"Salgados e aperitivos"}],sauce:["🥫",{fr:"Sauces & condiments",en:"Sauces & condiments",he:"רטבים",pt:"Molhos e condimentos"}],pantry:["🛒",{fr:"Épicerie",en:"Pantry",he:"מכולת",pt:"Mercearia"}]};
const ORDER=["promo","drinks","meat","cheese","shabbat","sweet","salty","sauce","pantry"];
const UI={fr:["Tous les rayons","produits","Choisis un rayon"],en:["All aisles","products","Pick an aisle"],he:["כל המחלקות","מוצרים","בחרו מחלקה"],pt:["Todos os corredores","produtos","Escolha um corredor"]};
const ui=k=>(UI[S.lang]||UI.fr)[k];
const gl=g=>GL[g][1][S.lang]||GL[g][1].fr;
function grp(i){const c=i.c||"",n=i.n||"";
if(/promo/i.test(c))return"promo";if(/boisson|vin|alcool/i.test(c))return"drinks";if(/boucher|viande/i.test(c))return"meat";if(/fromage|lait/i.test(c))return"cheese";if(/shabbat|chabbat|havdalah|vaisselle|maison/i.test(c))return"shabbat";if(/sucr|confiser|bonbon|petit d/i.test(c))return"sweet";if(/sal[ée]|snack/i.test(c))return"salty";if(/sauce/i.test(c))return"sauce";
if(/moscato|mos\(k\)ato|vin |arak|boukha|jus /i.test(n))return"drinks";if(/haribo|sour|oodles|taffy|lasso|cookie|boudoir|petit beurre|langue d|confiture|miel|chocolat|freedent/i.test(n))return"sweet";if(/sauce|harissa|moutarde|mayo|vinaigr|ketchup|pesto|tahin/i.test(n))return"sauce";if(/assiette|fourchette|couteau|cuill|gobelet|barquette|nappe|ravier|bessamim|veilleuse|plata|bougie|bols/i.test(n))return"shabbat";if(/pretzel|breadstick|cracker|cocktail|bissli|onion|oignons crispy|kubiot/i.test(n))return"salty";return"pantry"}
function pcard(i,blocked){return `<div class="pc"><div class="grow"><b>${esc(i.n)}</b>${i.d?`<br><span class="mute">${esc(i.d)}</span>`:""}</div><div class="row sp"><span>${priceHtml(i)}${stk(i)}</span>${qty(i,blocked)}</div></div>`}
shopGrid=function(){const q=nz((S.sq||"").trim()),sh=shabbat(),m=merch(S.shop)||SHOPS()[0],blocked=sh.closed||mdoc(m.id).closed,all=shopItems();
if(q){const its=all.filter(i=>nz(i.n+" "+(i.c||"")).includes(q));return its.length?`<div class="grid">${its.map(i=>pcard(i,blocked)).join("")}</div>`:`<p class="mute">${t("noRes")}</p>`}
if(!S.sg){const cnt={};all.forEach(i=>{const g=grp(i);cnt[g]=(cnt[g]||0)+1});return `<p class="mute">${ui(2)}</p><div class="rayg">${ORDER.filter(g=>cnt[g]).map(g=>`<button class="ray" data-a="sgrp" data-v="${g}"><span class="e">${GL[g][0]}</span><b>${gl(g)}</b><small>${cnt[g]} ${ui(1)}</small></button>`).join("")}</div>`}
const its=all.filter(i=>grp(i)===S.sg),cats=[...new Set(its.map(i=>i.c))];
let h=`<div class="rayhead"><button class="btn sm ghost" data-a="sgrp" data-v="">‹ ${ui(0)}</button><h3>${GL[S.sg][0]} ${gl(S.sg)}</h3></div>`;
if(cats.length>1)h+=`<div class="chips"><button class="chip" data-a="scat" data-v="" aria-pressed="${!S.sc}">${t("all")}</button>${cats.map(c=>`<button class="chip" data-a="scat" data-v="${esc(c)}" aria-pressed="${S.sc==c}">${esc(c)}</button>`).join("")}</div>`;
(S.sc&&cats.includes(S.sc)?[S.sc]:cats).forEach(c=>{const ci=its.filter(i=>i.c===c);h+=`${cats.length>1&&!S.sc?`<div class="raycat">${esc(c)}</div>`:""}<div class="grid">${ci.map(i=>pcard(i,blocked)).join("")}</div>`});
return h};
vShop=function(){if(!merch(S.shop))S.shop=SHOPS()[0].id;
return `<div><h2>${t("shop")}</h2><p class="mute">${t("shopSub")}</p></div><div class="hs">${SHOPS().map(m=>`<button class="stb" data-a="sstore" data-v="${m.id}" aria-pressed="${S.shop==m.id}">${m.img?`<img src="img/logo-${m.id}.jpg" alt="">`:""}<b>${esc(m.name)}</b></button>`).join("")}</div>
<label for="sq" style="color:inherit"><input type="text" id="sq" value="${esc(S.sq||"")}" placeholder="${t("shopSearch")}" autocomplete="off"></label><div id="sres">${shopGrid()}</div>`};
A.sgrp=function(v){S.sg=GL[v]?v:"";S.sc="";setTimeout(()=>{const r=document.getElementById("sq");if(r)scrollTo({top:r.getBoundingClientRect().top+scrollY-110,behavior:"smooth"})},30)};
const s0=A.sstore;A.sstore=function(v){s0(v);S.sg=""};
})();

/* ---------- Retour à la page précédente (bouton, geste iPhone) ---------- */
(function(){
let key=null,popping=false;const base=render;
const snap=()=>({tab:window.kRealTab||S.tab,rid:S.rid||null,tk:S.tk||null,sg:S.sg||"",wk:S.wk||0});
const k=()=>{const s=snap();return [s.tab,s.rid,s.tk,s.sg,s.wk].join("|")};
render=function(){base();const nk=k();try{if(key===null)history.replaceState(snap(),"");else if(nk!==key&&!popping)history.pushState(snap(),"")}catch(e){}key=nk;popping=false};
window.addEventListener("popstate",e=>{const s=e.state;if(!s||!s.tab)return;popping=true;S.tab=s.tab;S.rid=s.rid;S.tk=s.tk;S.sg=s.sg||"";S.sc="";S.wk=s.wk||0;S.day=null;render();scrollTo(0,0)});
const standalone=navigator.standalone===true||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
if(standalone){let x0=null,y0=0;
document.addEventListener("touchstart",e=>{const t0=e.touches[0],rtl=document.documentElement.dir==="rtl";x0=(rtl?innerWidth-t0.clientX:t0.clientX)<28?t0.clientX:null;y0=t0.clientY},{passive:true});
document.addEventListener("touchend",e=>{if(x0==null)return;const t1=e.changedTouches[0],rtl=document.documentElement.dir==="rtl",dx=(t1.clientX-x0)*(rtl?-1:1);x0=null;if(dx>70&&Math.abs(t1.clientY-y0)<60)history.back()},{passive:true})}
})();
render();
